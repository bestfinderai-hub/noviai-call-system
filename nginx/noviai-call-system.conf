upstream noviai_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name calls.noviai.se;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name calls.noviai.se;

    ssl_certificate     /etc/letsencrypt/live/calls.noviai.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calls.noviai.se/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket upgrade — required for Telnyx media streams
    location /ws {
        proxy_pass http://noviai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTP routes (webhooks, admin, health)
    location / {
        proxy_pass http://noviai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Block common scanner paths
    location ~* \.(php|asp|aspx|cgi)$ {
        return 444;
    }
}
