services:
  - type: web
    name: noviai-call-system
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Set these in Render dashboard → Environment
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PHONE_NUMBER
        sync: false
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: STT_PROVIDER
        value: groq
      - key: TTS_PROVIDER
        value: edge
      - key: TTS_VOICE
        value: sv-SE-SofieNeural
      - key: CALL_LANGUAGE
        value: sv
      - key: NOVA_ADMIN_TOKEN
        sync: false
      - key: AICHATT_DATABASE_URL
        sync: false
      - key: SENTIMENT_ENABLED
        value: "true"
      - key: RECORDING_ENABLED
        value: "false"
      - key: MEGA_EMAIL
        sync: false
      - key: MEGA_PASSWORD
        sync: false
      - key: SERVER_DOMAIN
        sync: false
